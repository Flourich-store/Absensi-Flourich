  <!-- ============================================================ -->
  <!-- Splash (Tahap 1): tampil sebelum JS memutuskan sesi/login     -->
  <!-- ============================================================ -->
  <div class="splash" id="screen-splash" role="status" aria-label="Memuat aplikasi">
    <div class="splash-logo" aria-hidden="true">✓</div>
    <h1 class="splash-title">Absensi Karyawan</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p class="splash-sub">Memuat…</p>
  </div>
  <noscript><style>#screen-splash{display:none!important}#screen-login{display:flex!important}</style></noscript>
  <script>
    // Jaring pengaman: bila app.js gagal dimuat, splash tidak menutupi layar
    // selamanya. Saat sesi tersimpan, layar login TIDAK boleh diperlihatkan —
    // biarkan splash sampai app.js mengambil alih. Tanpa sesi, login memang
    // tujuannya sehingga aman dipakai sebagai cadangan.
    setTimeout(function () {
      var s = document.getElementById('screen-splash');
      if (!s) return;
      var sesi = false;
      try { sesi = !!localStorage.getItem('absensi_token'); } catch (e) {}
      if (sesi) return;
      var l = document.getElementById('screen-login');
      if (l) l.hidden = false;
      s.hidden = true;
    }, 4000);
  </script>

  <!-- ============================================================ -->
  <!-- Layar Login                                                   -->
  <!-- ============================================================ -->
  <div class="screen-login" id="screen-login" hidden>
    <div class="login-card">
      <div class="login-logo" aria-hidden="true">✓</div>
      <h1 class="login-title">Absensi Karyawan</h1>

      <form id="form-login" autocomplete="off" novalidate>
        <label class="field">
          <span>Username</span>
          <input type="text" id="login-username" name="username"
                 autocapitalize="none" autocorrect="off" autocomplete="username"
                 inputmode="text" required maxlength="40" placeholder="contoh: admin">
        </label>
        <label class="field">
          <span>PIN</span>
          <input type="password" id="login-pin" name="pin"
                 inputmode="numeric" pattern="[0-9]*" maxlength="12"
                 autocomplete="current-password" placeholder="••••••" required>
        </label>

        <p class="form-error" id="login-error" hidden role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk</button>
      </form>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Aplikasi utama (diisi oleh app.js)                            -->
  <!-- ============================================================ -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar-text">
        <div class="topbar-title" id="topbar-title">Beranda</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
      <span class="role-badge" id="role-badge" hidden></span>
    </header>

    <main class="content" id="content" tabindex="-1">
      <div class="loading-state" id="content-loading">
        <div class="spinner" aria-label="Memuat"></div>
        <p>Memuat…</p>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Menu utama"></nav>
  </div>

  <!-- ============================================================ -->
  <!-- Overlay layar bertahap absen (bagian 11 PRD: 5 langkah)       -->
  <!-- ============================================================ -->
  <div class="overlay" id="overlay-absen" hidden role="dialog" aria-modal="true" aria-label="Alur absen">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="absen-title">Absen</h2>
        <button type="button" class="icon-btn" id="absen-close" aria-label="Tutup">✕</button>
      </div>
      <div class="sheet-body" id="absen-body"></div>
      <div class="sheet-foot" id="absen-foot" hidden></div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Overlay modal umum (form CRUD, koreksi, konfirmasi)           -->
  <!-- ============================================================ -->
  <div class="overlay" id="overlay-modal" hidden role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">Formulir</h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Tutup">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast pesan -->
  <div class="toast" id="toast" hidden aria-live="polite"></div>

  <!-- Konfigurasi publik (kunci Google Maps yang dibatasi referrer).
       Harus dimuat sebelum app.js. Lihat komentar di config.js. -->
  <script defer src="config.js"></script>
  <!-- Leaflet disimpan lokal (bukan CDN) dan dipakai sebagai peta cadangan
       bila Google Maps tidak tersedia; ubin peta tetap butuh jaringan. -->
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="api.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
